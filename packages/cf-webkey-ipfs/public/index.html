<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>web-key vault</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        max-width: 44rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      h1 {
        font-size: 1.4rem;
      }
      button {
        font: inherit;
        margin-right: 0.4rem;
      }
      li {
        margin: 0.6rem 0;
      }
      code,
      input[readonly] {
        font:
          0.85rem ui-monospace,
          monospace;
      }
      input[readonly] {
        width: 100%;
        box-sizing: border-box;
      }
      .note {
        background: #fff8d6;
        color: #111;
        padding: 0.6rem 0.8rem;
        border-radius: 0.3rem;
      }
      .error {
        color: #b00020;
      }
      .muted {
        opacity: 0.7;
        font-size: 0.9rem;
      }
      pre {
        white-space: pre-wrap;
        border: 1px solid #8884;
        padding: 0.6rem;
        max-height: 20rem;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>web-key vault</h1>
    <main id="app">Loading…</main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
